name: Poll voice memory bot

on:
  # Manual trigger — click "Run workflow" in the Actions tab (or the GitHub
  # mobile app) whenever you want an immediate check for new messages.
  workflow_dispatch:

  # Optional automatic trigger — runs every 15 minutes. Delete this whole
  # `schedule:` block if you only want manual triggering (matches "run it
  # when I need it" most literally, and costs zero Actions minutes when
  # idle). Keep it if you want closer-to-live behavior. See README.md for
  # the cost/frequency trade-off between a public and private repo.
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  packages: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Poll for new Telegram messages
        working-directory: /app
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WHISPER_MODEL: tiny
        run: python poll_once.py
