name: Poll voice memory bot

on:
  # Manual trigger — click "Run workflow" in the Actions tab (or the GitHub
  # mobile app) whenever you want an immediate check for new messages.
  workflow_dispatch:

  # Optional automatic trigger — runs every 15 minutes. Delete this whole
  # `schedule:` block if you only want manual triggering (matches "run it
  # when I need it" most literally, and costs zero Actions minutes when
  # idle). Keep it if you want closer-to-live behavior. See README.md for
  # the cost/frequency trade-off between a public and private repo.
  
  schedule:
    # Every 20 min, 6:00 AM–10:00 PM America/Chicago (currently CDT, UTC-5).
    # GitHub Actions cron is UTC-only: 11:00-23:40 and 00:00-02:40 UTC covers
    # 6:00 AM-9:40 PM local, plus one more run at 03:00 UTC for the 10:00 PM
    # local slot.
    # NOTE: when US DST ends (Sun Nov 1, 2026) Chicago moves to CST (UTC-6)
    # and this same UTC schedule will fire an hour earlier locally
    # (5:00 AM-9:00 PM) until these hours are shifted back by one.
    - cron: "*/20 11-23,0-2 * * *"
    - cron: "0 3 * * *"

permissions:
  contents: read
  packages: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Poll for new Telegram messages
        working-directory: /app
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WHISPER_MODEL: tiny
        run: python poll_once.py
