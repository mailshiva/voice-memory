name: Live session (voice memory bot)

on:
  # Trigger right before you start asking questions, for a stretch of
  # near-instant back-and-forth instead of waiting for the next scheduled
  # poll.yml tick. Runs live_session.py, which long-polls Telegram in a
  # loop for `duration_minutes` and then exits back to the normal schedule.
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Minutes to stay actively listening"
        required: false
        default: "15"
        type: number

permissions:
  contents: read
  packages: read

jobs:
  live-session:
    runs-on: ubuntu-latest
    # A fixed backstop, not the actual duration control — that's
    # DURATION_MINUTES below, enforced by live_session.py's own internal
    # deadline. This just guarantees the job can't hang forever if
    # something goes wrong. GitHub Actions expressions don't support
    # arithmetic (no `+`), so this can't be computed as "duration + 5" —
    # if you ever dispatch with a duration_minutes above ~55, raise this
    # number to match.
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Run live polling session
        working-directory: /app
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WHISPER_MODEL: tiny
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
        run: python live_session.py
